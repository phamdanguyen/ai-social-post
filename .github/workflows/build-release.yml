name: Build and Release

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore src/AiSocialPost.sln

    - name: Build solution
      run: dotnet build src/AiSocialPost.sln --configuration Release --no-restore

    - name: Publish WinForms app
      run: dotnet publish src/AiSocialPost.WinForms/AiSocialPost.WinForms.csproj --configuration Release --output ./publish --self-contained true --runtime win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

    - name: Create release folder
      run: |
        mkdir release
        cp publish/AiSocialPost.exe release/
        cp publish/appsettings.json release/
        echo "AI Social Post v1.0.0" > release/README.txt
        echo "" >> release/README.txt
        echo "Hướng dẫn sử dụng:" >> release/README.txt
        echo "1. Chạy AiSocialPost.exe" >> release/README.txt
        echo "2. Click Settings để cấu hình API keys" >> release/README.txt
        echo "3. Click 'Tìm Trends' để bắt đầu" >> release/README.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: AiSocialPost-Windows-x64
        path: release/

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/AiSocialPost.exe
          release/appsettings.json
          release/README.txt
        body: |
          ## AI Social Post v${{ github.ref_name }}

          ### Tính năng
          - ✅ Tìm trends tự động (placeholder - sẽ integrate Gemini)
          - ✅ Tạo content với AI (placeholder)
          - ✅ Đăng bài lên 5 platforms (placeholder)
          - ✅ AI reply comments (placeholder)
          - ✅ Rate limiting (10 req/min - tôn trọng Gemini limits)

          ### Cài đặt
          1. Download file `AiSocialPost.exe`
          2. Download file `appsettings.json`
          3. Đặt 2 files cùng folder
          4. Chạy `AiSocialPost.exe`

          ### Yêu cầu
          - Windows 10/11
          - .NET 6 Runtime (hoặc dùng file self-contained)

          **Lưu ý**: Đây là phiên bản MVP với placeholder implementations. Gemini API và platform integrations sẽ được thêm sau.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
